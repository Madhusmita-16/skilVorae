# SkilVorae Application Configuration
spring.application.name=SkilVorae
server.port=8080

# Primary Database: MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/skilvoraedb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# JPA & Hibernate MySQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 In-Memory Fallback (uncomment if running without local MySQL daemon)
# spring.datasource.url=jdbc:h2:mem:skilvoraedb;DB_CLOSE_DELAY=-1;MODE=MySQL
# spring.datasource.driver-class-name=org.h2.Driver
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true

# Thymeleaf Settings
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Security & JWT Configuration
skilvorae.jwt.secret=9a2f8c7e1d4b6a3e5f8c1d4b6a3e5f8c9a2f8c7e1d4b6a3e5f8c1d4b6a3e5f8c
skilvorae.jwt.expiration-ms=86400000

# JavaMailSender Properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=noreply@skilvorae.com
spring.mail.password=dummy-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
