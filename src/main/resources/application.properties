# SkilVorae Application Configuration
spring.application.name=SkilVorae
server.port=${PORT:8080}

# ============================
# Database: MySQL
# ============================
spring.datasource.url=jdbc:mysql://localhost:3306/skilvoraedb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# JPA & Hibernate - MySQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Security & JWT
skilvorae.jwt.secret=9a2f8c7e1d4b6a3e5f8c1d4b6a3e5f8c9a2f8c7e1d4b6a3e5f8c1d4b6a3e5f8c
skilvorae.jwt.expiration-ms=86400000

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=noreply@skilvorae.com
spring.mail.password=dummy-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
