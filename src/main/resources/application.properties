# SkilVorae Application Configuration
spring.application.name=SkilVorae
server.port=8080

# Default Database: H2 In-Memory with Oracle Mode for Instant Zero-Setup Execution
spring.datasource.url=jdbc:h2:mem:skilvoraedb;DB_CLOSE_DELAY=-1;MODE=Oracle
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Settings
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Security & JWT Configuration
skilvorae.jwt.secret=9a2f8c7e1d4b6a3e5f8c1d4b6a3e5f8c9a2f8c7e1d4b6a3e5f8c1d4b6a3e5f8c
skilvorae.jwt.expiration-ms=86400000

# JavaMailSender Properties (Development Mock Fallback Included in MailService)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=noreply@skilvorae.com
spring.mail.password=dummy-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
