# SkilVorae Application Configuration
spring.application.name=SkilVorae
server.port=${PORT:8080}

# ============================
# Database Configuration
# Defaults to H2 in-memory DB for instant deployment on cloud platforms without external DB setup.
# Set SPRING_DATASOURCE_URL to a MySQL JDBC URL (e.g. Aiven, Railway) for persistent MySQL database.
# ============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:skilvoraedb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA & Hibernate (Dialect and Driver auto-detected by Spring Boot)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Security & JWT
skilvorae.jwt.secret=9a2f8c7e1d4b6a3e5f8c1d4b6a3e5f8c9a2f8c7e1d4b6a3e5f8c1d4b6a3e5f8c
skilvorae.jwt.expiration-ms=86400000

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=noreply@skilvorae.com
spring.mail.password=${SPRING_MAIL_PASSWORD:dummy-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# File Upload
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
