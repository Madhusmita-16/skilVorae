<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-main);">

    <div style="font-size: 3rem; color: var(--electric-violet); margin-bottom: 1rem;">

    <h2 style="margin-bottom: 1rem;">Feature in Development</h2>
    <p style="margin-bottom: 2rem; color: var(--text-secondary);">
      The requested page <strong th:text="${path}" style="color: var(--midnight-plum);">/path</strong> is currently being built and will be available in the next release.

    <button onclick="window.history.back()" class="btn btn-primary" style="width: 100%;">Go Back</button>
