<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Assessment Results — SkilVorae</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body style="background: var(--bg-main); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 0;">

  <div class="card" style="width: 100%; max-width: 540px; padding: 3rem; text-align: center;">
    <div style="margin-bottom: 1rem;">
      <span class="badge" th:classappend="${result.passed ? 'badge-success' : 'badge-danger'}" style="font-size: 1rem; padding: 0.5rem 1.25rem;" th:text="${result.passed ? 'PASSED' : 'NOT PASSED'}">PASSED</span>
    </div>
    
    <h1 style="font-size: 2rem; margin-bottom: 0.5rem;" th:text="${result.passed ? 'Assessment Passed!' : 'Assessment Not Passed'}">Passed!</h1>
    <p th:text="${result.courseTitle}">Course Name</p>

    <!-- Score Gauge Card -->
    <div style="background: var(--bg-subtle); padding: 2rem; border-radius: var(--border-radius); margin: 2rem 0;">
      <div style="font-size: 3rem; font-weight: 800; color: var(--primary);" th:text="${#numbers.formatDecimal(result.score, 1, 1) + '%'}">85.0%</div>
      <div style="font-size: 0.9rem; color: var(--text-muted);" th:text="${'Correct Answers: ' + result.correctAnswers + ' of ' + result.totalQuestions}">Correct: 4 of 5</div>
      <div style="font-size: 0.85rem; margin-top: 0.5rem;" th:text="${'Required Passing Threshold: ' + result.passingScore + '%'}">Required: 70%</div>
    </div>

    <div style="display: flex; gap: 1rem; justify-content: center;">
      <a th:href="@{/dashboard}" class="btn btn-outline">Back to Dashboard</a>
      
      <th:block th:if="${result.passed && result.certificateCode != null}">
        <a th:href="@{/certificates/{code}(code=${result.certificateCode})}" class="btn btn-accent" target="_blank">View Certificate</a>
      </th:block>

      <th:block th:if="${!result.passed}">
        <a th:href="@{/assessments/{id}(id=${result.courseId})}" class="btn btn-primary">Retake Assessment</a>
      </th:block>
    </div>
  </div>

</body>
</html>
