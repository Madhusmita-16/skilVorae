<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Users & Roles — SkilVorae Admin</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

  <div class="dashboard-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar('users')}"></div>

    <main class="dashboard-main">
      <div th:replace="~{fragments/dashboard-header :: header('Users & Roles')}"></div>

      <div class="courses-list-header" style="margin-bottom: 1.5rem;">
        <h2 class="section-title">Users & Roles</h2>
      </div>

      <div class="card" style="padding: 0; overflow: hidden;">
        <table class="dashboard-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="userObj : ${users}">
              <td th:text="${userObj.id}" style="font-weight: 700;">1</td>
              <td th:text="${userObj.fullName}" style="font-weight: 600; color: var(--text-primary);">Name</td>
              <td th:text="${userObj.email}">email@example.com</td>
              <td><span class="badge badge-lavender" th:text="${userObj.role.name()}">ROLE</span></td>
              <td><span class="badge badge-lime">Active</span></td>
            </tr>
            <tr th:if="${#lists.isEmpty(users)}">
              <td colspan="5" style="text-align: center; padding: 2rem;">No users found.</td>
            </tr>
          </tbody>
        </table>
      </div>

    </main>
  </div>
</body>
</html>
