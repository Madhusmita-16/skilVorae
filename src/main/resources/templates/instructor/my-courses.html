<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Courses - SkilVorae Instructor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
    <div class="dashboard-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar('instructor')}"></div>
        <main class="dashboard-main">
            <div th:replace="~{fragments/dashboard-header :: header}"></div>
            <div class="dashboard-content">
                <div class="header-actions" style="margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center;">
                    <h2>My Courses</h2>
                    <a th:href="@{/instructor/course/create}" class="btn btn-primary">Create New Course</a>
                </div>
                
                <div class="card" style="padding: 2rem;">
                    <p class="text-muted">You have not created any courses yet. Click "Create New Course" to get started.</p>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
