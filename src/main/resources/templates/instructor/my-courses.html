<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Courses - SkilVorae Instructor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>
    <div class="dashboard-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar('instructor')}"></div>
        <main class="dashboard-main">
            <div th:replace="~{fragments/dashboard-header :: header('My Courses')}"></div>
            <div class="dashboard-content">
                <div class="header-actions" style="margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center;">
                    <h2>My Courses</h2>
                    <a th:href="@{/instructor/course/create}" class="btn btn-primary">Create New Course</a>
                </div>
                
                <div th:if="${#lists.isEmpty(courses)}" class="card" style="padding: 2rem;">
                    <p class="text-muted">You have not created any courses yet. Click "Create New Course" to get started.</p>
                </div>
                
                <div th:if="${!#lists.isEmpty(courses)}" class="courses-grid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem;">
                    <div th:each="course : ${courses}" class="course-card" th:style="${course.isArchived} ? 'opacity:0.6;' : ''">
                        <img th:src="${course.thumbnailUrl != null and !course.thumbnailUrl.isEmpty() ? course.thumbnailUrl : 'https://placehold.co/600x400/e2e8f0/475569?text=Course+Thumbnail'}" alt="Course Thumbnail" style="width: 100%; height: 180px; object-fit: cover;">
                        <div class="course-card-content" style="padding: 1.5rem;">
                            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                                <h3 style="margin-bottom:0.5rem;"><a th:href="@{/courses/{id}(id=${course.id})}" th:text="${course.title}" target="_blank" style="color:var(--text-color); text-decoration:none;">Course Title</a></h3>
                            </div>
                            <div style="margin-bottom:0.5rem;">
                                <span th:if="${course.isArchived != null and course.isArchived}" class="badge" style="background:#f3f4f6;color:#4b5563;font-size:0.75rem;padding:2px 8px;border-radius:12px;">Archived</span>
                            </div>
                            <p class="instructor" th:text="${course.instructorName}" style="color:var(--text-muted); font-size:0.875rem; margin-bottom:0.5rem;">Instructor Name</p>
                            <div class="course-meta" style="font-size:0.875rem; color:var(--text-secondary); margin-bottom:0.5rem;">
                                <span th:text="${course.difficulty}">Beginner</span>
                                <span>•</span>
                                <span th:text="${course.enrollmentCount + ' Students'}">0 Students</span>
                            </div>
                            <div class="price" style="margin-top:0.5rem; font-weight:600; color:var(--primary-color);">
                                <span th:text="${'₹' + course.price}">₹0.00</span>
                            </div>
                            
                            <div style="margin-top: 1.5rem; display: flex; gap: 0.5rem;">
                                <a th:href="@{/courses/{id}(id=${course.id})}" class="btn btn-outline btn-sm" target="_blank" style="flex:1; text-align:center;">View</a>
                                <a th:href="@{/instructor/course/{id}/edit(id=${course.id})}" class="btn btn-primary btn-sm" style="flex:1; text-align:center;">Edit</a>
                            </div>
                            
                            <div style="margin-top: 0.5rem; display: flex; gap: 0.5rem;">
                                <form th:action="@{/instructor/course/{id}/archive(id=${course.id})}" method="post" style="flex:1;">
                                    <button type="submit" class="btn btn-secondary btn-sm" style="width:100%;" th:text="${course.isArchived ? 'Unarchive' : 'Archive'}">Archive</button>
                                </form>
                                <form th:action="@{/instructor/course/{id}/delete(id=${course.id})}" method="post" style="flex:1;" onsubmit="return confirm('Are you sure you want to permanently delete this course?');">
                                    <button type="submit" class="btn btn-sm" style="width:100%; background:#ef4444; color:white; border-color:#ef4444;">Delete</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
