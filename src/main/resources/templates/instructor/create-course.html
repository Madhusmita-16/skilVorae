<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Course - SkilVorae Instructor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <style>
        .form-container {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            max-width: 800px;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-body);
            color: var(--text-color);
        }
        .form-group textarea {
            resize: vertical;
        }
    </style>
</head>
<body>
    <div class="dashboard-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar('instructor')}"></div>
        
        <main class="dashboard-main">
            <div th:replace="~{fragments/dashboard-header :: header('Create Course')}"></div>
            
            <div class="dashboard-content">
                <div class="header-actions" style="margin-bottom: 2rem;">
                    <h2>Create a New Course</h2>
                </div>

                <div class="form-container">
                    <form th:action="@{/instructor/course/create}" th:object="${course}" method="post" enctype="multipart/form-data">
                        <div class="form-group">
                            <label for="title">Course Title</label>
                            <input type="text" id="title" th:field="*{title}" required placeholder="e.g. Advanced Java Masterclass">
                        </div>
                        
                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea id="description" th:field="*{description}" rows="5" required placeholder="What will students learn?"></textarea>
                        </div>
                        
                        <div class="form-group" style="display: flex; gap: 1rem;">
                            <div style="flex: 1;">
                                <label for="difficulty">Difficulty</label>
                                <select id="difficulty" th:field="*{difficulty}">
                                    <option value="BEGINNER">Beginner</option>
                                    <option value="INTERMEDIATE">Intermediate</option>
                                    <option value="ADVANCED">Advanced</option>
                                </select>
                            </div>
                            <div style="flex: 1;">
                                <label for="price">Price (₹)</label>
                                <input type="number" step="0.01" id="price" th:field="*{price}" required value="0.00">
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Thumbnail Image (Optional)</label>
                            <input type="file" name="thumbnailFile" accept="image/*">
                        </div>

                        <!-- We omit Category mapping here for brevity, assume default logic in controller or hidden field -->
                        <input type="hidden" name="category.id" value="1">
                        
                        <button type="submit" class="btn btn-primary">Create Course</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
