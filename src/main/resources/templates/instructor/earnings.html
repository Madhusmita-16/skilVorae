<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Earnings - SkilVorae</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <style>
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
        }
        th {
            background-color: var(--bg-body);
            color: var(--text-muted);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="dashboard-wrapper">
        <div th:replace="~{fragments/sidebar :: sidebar(activeTab='instructor')}"></div>
        <main class="dashboard-main">
            <div th:replace="~{fragments/dashboard-header :: header('Earnings')}"></div>
            <div class="dashboard-content">
                <div class="header-actions" style="margin-bottom: 2rem;">
                    <h2>Earnings & Revenue</h2>
                </div>
                
                <div class="card" style="padding: 2rem; margin-bottom: 2rem; background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); color: white;">
                    <h3 style="color: rgba(255,255,255,0.8); font-size: 0.875rem;">Total Lifetime Earnings</h3>
                    <p style="font-size: 2.5rem; font-weight: 700; margin-top: 0.5rem;" th:text="'₹' + ${#numbers.formatDecimal(user.instructorEarningsTotal ?: 0.0, 1, 2)}"></p>
                </div>

                <div class="card" style="padding: 1rem;">
                    <div style="padding: 1rem;">
                        <h3 style="margin-bottom: 1rem;">Recent Transactions</h3>
                    </div>
                    
                    <div th:if="${#lists.isEmpty(earnings)}" style="text-align: center; padding: 2rem;">
                        <p class="text-muted">No earning transactions recorded yet.</p>
                    </div>

                    <div class="table-responsive" th:if="${!#lists.isEmpty(earnings)}">
                        <table>
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Course</th>
                                    <th>Source</th>
                                    <th>Amount</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="earning : ${earnings}">
                                    <td th:text="${#temporals.format(earning.earnedAt, 'MMM dd, yyyy HH:mm')}"></td>
                                    <td style="font-weight: 500;" th:text="${earning.enrollment.course.title}"></td>
                                    <td>
                                        <div th:text="${earning.enrollment.user.fullName}"></div>
                                        <div style="font-size: 0.75rem; color: var(--text-muted);" th:text="${'Enrollment #' + earning.enrollment.id}"></div>
                                    </td>
                                    <td style="font-weight: 600; color: var(--success-color);" th:text="'+ ₹' + ${#numbers.formatDecimal(earning.amount, 1, 2)}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
