<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Course Catalog — SkilVorae</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <link rel="stylesheet" th:href="@{/css/course.css}">
</head>
<body>

  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <div class="container">
    <div class="catalog-header">
      <h1>Explore Course Catalog</h1>
      <p style="font-size: 1.1rem; max-width: 600px; margin: 0.5rem auto 0;">Structured curriculums designed to advance software engineering skills with hands-on practice.</p>
    </div>

    <!-- Search & Filter Bar -->
    <form th:action="@{/courses}" method="get" class="filter-bar">
      <div style="flex: 1; min-width: 240px;">
        <input type="text" name="search" class="form-control" placeholder="Search by title or topic..." th:value="${selectedSearch}">
      </div>

      <div class="filter-group">
        <select name="categoryId" class="form-control" onchange="this.form.submit()">
          <option value="">All Categories</option>
          <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${cat.id == selectedCategory}">Category</option>
        </select>
      </div>

      <div class="filter-group">
        <select name="difficulty" class="form-control" onchange="this.form.submit()">
          <option value="">All Difficulties</option>
          <option value="BEGINNER" th:selected="${selectedDifficulty == 'BEGINNER'}">Beginner</option>
          <option value="INTERMEDIATE" th:selected="${selectedDifficulty == 'INTERMEDIATE'}">Intermediate</option>
          <option value="ADVANCED" th:selected="${selectedDifficulty == 'ADVANCED'}">Advanced</option>
        </select>
      </div>

      <div class="filter-group">
        <select name="minRating" class="form-control" onchange="this.form.submit()">
          <option value="">All Ratings</option>
          <option value="4.5" th:selected="${selectedMinRating == 4.5}">4.5+ Rating</option>
          <option value="4.8" th:selected="${selectedMinRating == 4.8}">4.8+ Rating</option>
        </select>
      </div>

      <div class="filter-group">
        <select name="sortBy" class="form-control" onchange="this.form.submit()">
          <option value="rating" th:selected="${selectedSortBy == 'rating'}">Highest Rated</option>
          <option value="popular" th:selected="${selectedSortBy == 'popular'}">Most Popular</option>
          <option value="newest" th:selected="${selectedSortBy == 'newest'}">Newest First</option>
          <option value="priceLow" th:selected="${selectedSortBy == 'priceLow'}">Price: Low to High</option>
          <option value="priceHigh" th:selected="${selectedSortBy == 'priceHigh'}">Price: High to Low</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary btn-sm">Filter</button>
      <a th:href="@{/courses}" class="btn btn-outline btn-sm">Clear</a>
    </form>

    <!-- Course Grid -->
    <div class="course-grid">
      <div class="card card-interactive"
           th:each="course : ${coursePage.content}"
           style="display: flex; flex-direction: column; justify-content: space-between; height: 100%;">
        
        <div>
          <div style="position: relative; overflow: hidden; border-radius: var(--radius-md) var(--radius-md) 0 0; margin: -1.5rem -1.5rem 1.25rem -1.5rem; height: 180px;">
            <img th:src="${course.thumbnailUrl}" style="width: 100%; height: 100%; object-fit: cover;" alt="Thumbnail">
            <span class="badge-discount" style="position: absolute; top: 12px; right: 12px; font-weight: 700;" th:text="${course.discountPercentage + '% OFF'}">50% OFF</span>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; gap: 0.5rem; flex-wrap: wrap;">
            <span class="badge badge-lavender" th:text="${course.categoryName}">Category</span>
            <span class="badge badge-plum" th:text="${course.difficulty}">Beginner</span>
          </div>

          <h3 class="course-card-title" style="font-size: 1.1rem; line-height: 1.4; margin-bottom: 0.5rem;">
            <a th:href="@{/courses/{id}(id=${course.id})}" th:text="${course.title}">Title</a>
          </h3>

          <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.75rem;" th:text="${'By ' + course.instructorName}">By Instructor</p>

          <p style="font-size: 0.88rem; color: var(--text-secondary); line-height: 1.5; margin-bottom: 1.25rem;" th:text="${#strings.abbreviate(course.description, 100)}">Description</p>
        </div>

        <div style="margin-top: auto; padding-top: 1rem; border-top: 1px solid var(--border-color);">
          <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.825rem; color: var(--text-muted); margin-bottom: 0.85rem;">
            <span><span th:text="${course.durationHours != null ? #numbers.formatDecimal(course.durationHours, 1, 0) + ' Hours' : '12 Hours'}">12 Hours</span></span>
            <span><span th:text="${(course.totalModules != null && course.totalModules > 0 ? course.totalModules : 3) + ' Modules'}">3 Modules</span></span>
            <span style="font-weight: 700; color: var(--warning);" th:text="${'Rating: ' + course.rating}">Rating: 4.8</span>
          </div>

          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
              <span class="price-tag" style="font-size: 1.1rem; font-weight: 700;" th:text="${course.formattedPrice}">₹1,499 + taxes</span>
              <span class="price-original" style="font-size: 0.85rem; text-decoration: line-through; color: var(--text-muted); margin-left: 0.35rem;" th:text="${'₹' + #numbers.formatDecimal(course.originalPrice, 0, 'COMMA', 0, 'POINT')}">₹2,999</span>
            </div>
            <a th:href="@{/courses/{id}(id=${course.id})}" class="btn btn-outline btn-sm">View Details</a>
          </div>
        </div>
    </div>

    <!-- Catalog Pagination Bar -->
    <div th:if="${coursePage.totalPages > 1}" style="display: flex; justify-content: center; align-items: center; gap: 0.75rem; margin-top: 3rem; margin-bottom: 1rem;">
      <a th:if="${coursePage.hasPrevious()}"
         th:href="@{/courses(page=${coursePage.number - 1}, search=${selectedSearch}, categoryId=${selectedCategory}, difficulty=${selectedDifficulty}, minRating=${selectedMinRating}, sortBy=${selectedSortBy})}"
         class="btn btn-outline btn-sm">← Previous</a>
      
      <span style="font-weight: 700; font-size: 0.9rem; color: var(--text-secondary);"
            th:text="${'Page ' + (coursePage.number + 1) + ' of ' + coursePage.totalPages}">Page 1 of 5</span>

      <a th:if="${coursePage.hasNext()}"
         th:href="@{/courses(page=${coursePage.number + 1}, search=${selectedSearch}, categoryId=${selectedCategory}, difficulty=${selectedDifficulty}, minRating=${selectedMinRating}, sortBy=${selectedSortBy})}"
         class="btn btn-outline btn-sm">Next →</a>
    </div>
  </div>

  <div th:replace="~{fragments/footer :: footer}"></div>
  <script th:src="@{/js/main.js}"></script>
</body>
</html>
