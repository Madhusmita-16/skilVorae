<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>User Profile — SkilVorae</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

  <div class="dashboard-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar('profile')}"></div>

    <main class="dashboard-main">
      <div style="margin-bottom: 2rem;">
        <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">User Profile & Earned Certificates</h1>
        <p>Manage your account settings and download earned course certificates.</p>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
        <!-- Profile Update Card -->
        <div class="card">
          <h3 style="margin-bottom: 1.5rem; font-size: 1.2rem;">Personal Details</h3>
          <form onsubmit="handleUpdateProfile(event)">
            <div class="form-group">
              <label class="form-label" for="fullName">Full Name</label>
              <input type="text" id="fullName" class="form-control" th:value="${user.fullName}" required>
            </div>

            <div class="form-group">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-control" th:value="${user.email}" disabled style="background: var(--bg-subtle);">
            </div>

            <div class="form-group">
              <label class="form-label" for="newPassword">New Password (optional)</label>
              <input type="password" id="newPassword" class="form-control" placeholder="Leave blank to keep unchanged">
            </div>

            <div class="form-group">
              <label class="form-label" for="currentPassword">Current Password (required to save changes)</label>
              <input type="password" id="currentPassword" class="form-control" placeholder="••••••••">
            </div>

            <button type="submit" id="save-profile-btn" class="btn btn-primary" style="margin-top: 1rem;">Save Profile Changes</button>
          </form>
        </div>

        <!-- Earned Certificates -->
        <div class="card">
          <h3 style="margin-bottom: 1.5rem; font-size: 1.2rem;">Earned Certificates</h3>

          <div th:if="${#lists.isEmpty(certificates)}" style="text-align: center; padding: 2rem; color: var(--text-muted);">
            No certificates earned yet. Pass a course assessment with ≥ 70% to issue a certificate.
          </div>

          <div th:each="cert : ${certificates}" style="padding: 1rem; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 1rem; display: flex; align-items: center; justify-content: space-between;">
            <div>
              <div style="font-weight: 700; font-size: 0.95rem;" th:text="${cert.courseTitle}">Course Name</div>
              <div style="font-size: 0.8rem; color: var(--text-muted);" th:text="${'Issued on: ' + #temporals.format(cert.issuedAt, 'dd MMM yyyy')}">Date</div>
              <div style="font-size: 0.75rem; font-family: monospace; color: var(--accent);" th:text="${cert.certificateCode}">SKV-2026-X89A1</div>
            </div>
            <a th:href="@{/certificates/{code}(code=${cert.certificateCode})}" class="btn btn-outline btn-sm" target="_blank">View Certificate</a>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script th:src="@{/js/main.js}"></script>
  <script>
    async function handleUpdateProfile(e) {
      e.preventDefault();
      const btn = document.getElementById('save-profile-btn');
      btn.disabled = true;

      const fullName = document.getElementById('fullName').value;
      const currentPassword = document.getElementById('currentPassword').value;
      const newPassword = document.getElementById('newPassword').value;

      try {
        const res = await fetch('/api/profile', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fullName, currentPassword, newPassword })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          showToast('Profile updated successfully!', 'success');
          setTimeout(() => location.reload(), 1000);
        } else {
          showToast(data.message || 'Failed to update profile', 'error');
          btn.disabled = false;
        }
      } catch(err) {
        showToast('Server connection error', 'error');
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
