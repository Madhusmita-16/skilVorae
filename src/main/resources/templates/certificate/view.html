<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${'Certificate - ' + certificate.studentName}">Certificate — SkilVorae</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
  <link rel="stylesheet" th:href="@{/css/certificate.css}">
</head>
<body style="background: #F1F5F9; padding: 2rem 0;">

  <div class="no-print" style="max-width: 960px; margin: 0 auto 1.5rem auto; display: flex; justify-content: space-between; align-items: center;">
    <a th:href="@{/profile}" class="btn btn-outline btn-sm">Back to Profile</a>
    <button onclick="window.print()" class="btn btn-primary btn-sm">Print / Save as PDF</button>
  </div>

  <div class="certificate-wrapper">
    <div class="cert-header">
      <div class="cert-logo">SKILVORAE</div>
      <div class="cert-subtitle">Certificate of Completion</div>
    </div>

    <div class="cert-body">
      <p style="font-size: 1.1rem; color: #475569;">This is to certify that</p>
      <div class="cert-recipient" th:text="${certificate.studentName}">Student Name</div>
      <p style="font-size: 1.1rem; color: #475569; margin-top: 1rem;">has successfully completed the comprehensive professional course</p>
      <div class="cert-course" th:text="${certificate.courseTitle}">Course Name</div>
    </div>

    <div class="cert-footer">
      <div style="text-align: left;">
        <div style="font-size: 0.85rem; color: #64748B;">Instructed By</div>
        <div style="font-weight: 700; font-size: 1rem; color: #0F172A;" th:text="${certificate.instructorName}">Instructor Name</div>
      </div>

      <div>
        <div class="cert-seal">VERIFIED</div>
      </div>

      <div style="text-align: right;">
        <div style="font-size: 0.85rem; color: #64748B;" th:text="${'Issued Date: ' + #temporals.format(certificate.issuedAt, 'MMMM dd, yyyy')}">Issued Date</div>
        <div style="font-family: monospace; font-weight: 700; font-size: 0.9rem; color: #2563EB; margin-top: 0.25rem;" th:text="${'ID: ' + certificate.certificateCode}">ID: SKV-2026-X89A1</div>
      </div>
    </div>
  </div>

</body>
</html>
