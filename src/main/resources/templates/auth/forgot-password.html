<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password — SkilVorae</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body style="background: var(--bg-main); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 0;">

  <div class="card" style="width: 100%; max-width: 420px; padding: 2.5rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a th:href="@{/}" class="brand-logo" style="justify-content: center; margin-bottom: 1rem;">
        <div class="brand-icon">S</div>
        <span>SkilVorae</span>
      </a>
      <h2>Reset Password</h2>
      <p style="font-size: 0.9rem; margin-top: 0.25rem;">Enter your email to receive a 6-digit OTP code</p>
    </div>

    <form onsubmit="handleForgotPassword(event)">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="student@skilvorae.com" required value="student@skilvorae.com">
      </div>

      <button type="submit" id="send-otp-btn" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">Send OTP Code</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted);">
      Remembered password? <a th:href="@{/login}">Sign In</a>
    </div>
  </div>

  <script th:src="@{/js/main.js}"></script>
  <script>
    async function handleForgotPassword(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const btn = document.getElementById('send-otp-btn');
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          showToast('OTP sent! Check console / email', 'success');
          setTimeout(() => window.location.href = `/verify-otp?email=${encodeURIComponent(email)}`, 1200);
        } else {
          showToast(data.message || 'Error generating OTP', 'error');
          btn.disabled = false;
        }
      } catch(err) {
        showToast('Server connection error', 'error');
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
