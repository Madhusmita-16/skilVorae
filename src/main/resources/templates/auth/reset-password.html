<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Set New Password — SkilVorae</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body style="background: var(--bg-main); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 0;">

  <div class="card" style="width: 100%; max-width: 420px; padding: 2.5rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a th:href="@{/}" class="brand-logo" style="justify-content: center; margin-bottom: 1rem;">
        <div class="brand-icon">S</div>
        <span>SkilVorae</span>
      </a>
      <h2>Set New Password</h2>
      <p style="font-size: 0.9rem; margin-top: 0.25rem;">Choose a strong new password for your account</p>
    </div>

    <form onsubmit="handleResetPassword(event)">
      <input type="hidden" id="email" th:value="${email}">
      <input type="hidden" id="otp" th:value="${otp}">

      <div class="form-group">
        <label class="form-label" for="newPassword">New Password</label>
        <input type="password" id="newPassword" class="form-control" placeholder="••••••••" minlength="6" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" id="reset-btn" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">Update Password</button>
    </form>
  </div>

  <script th:src="@{/js/main.js}"></script>
  <script>
    async function handleResetPassword(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const otp = document.getElementById('otp').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const btn = document.getElementById('reset-btn');

      if (newPassword !== confirmPassword) {
        showToast('Passwords do not match', 'error');
        return;
      }

      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: email,
            otp: otp,
            newPassword: newPassword,
            confirmPassword: confirmPassword
          })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          showToast('Password updated! Redirecting to login...', 'success');
          setTimeout(() => window.location.href = '/login?resetSuccess=true', 1200);
        } else {
          showToast(data.message || 'Failed to reset password', 'error');
          btn.disabled = false;
        }
      } catch(err) {
        showToast('Server connection error', 'error');
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
