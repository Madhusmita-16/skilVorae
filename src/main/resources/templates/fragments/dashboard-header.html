<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header class="dashboard-header" th:fragment="header(pageName)">
  <div class="header-left">
    <button id="sidebar-toggle-btn" class="btn btn-outline btn-sm" style="padding: 0.4rem 0.6rem; display: flex; align-items: center; gap: 0.5rem;" onclick="toggleSidebar()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
    <div class="breadcrumbs">
      <span>SkilVorae LMS</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
      <span th:text="${user != null ? #strings.capitalize(user.role.name().toLowerCase()) : 'Portal'}">Student</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
      <span class="current" th:text="${pageName != null ? pageName : 'Dashboard'}">Dashboard</span>
    </div>
  </div>

  <div class="header-right">
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="text" placeholder="Search courses, resources, people...">
    </div>

    <!-- Calendar Icon -->
    <a th:href="@{/calendar}" class="btn btn-outline btn-sm" style="padding: 0.4rem; position: relative; display: flex; align-items: center; justify-content: center; border-radius: 50%;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
    </a>

    <!-- Notification Icon & Dropdown -->
    <div style="position: relative;" id="notification-dropdown-container">
      <button class="btn btn-outline btn-sm" id="notification-toggle-btn" style="padding: 0.4rem; position: relative; display: flex; align-items: center; justify-content: center; border-radius: 50%;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        <span class="badge badge-advanced" style="position: absolute; top: -5px; right: -5px; font-size: 0.6rem; padding: 0.15rem 0.3rem;">3</span>
      </button>

      <!-- Notification Panel -->
      <div id="notification-menu" class="card" style="display: none; position: absolute; right: 0; top: 120%; width: 320px; z-index: 1000; padding: 0; box-shadow: var(--shadow-lg);">
        <div style="padding: 1rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
          <h4 style="font-size: 1rem; margin: 0;">Notifications</h4>
          <a th:href="@{/notifications}" style="font-size: 0.75rem; color: var(--electric-violet); font-weight: 700;">Mark all read</a>
        </div>
        <div style="max-height: 300px; overflow-y: auto;">
          <div style="padding: 1rem; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 0.2rem; cursor: pointer; background: var(--bg-subtle);">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span style="font-weight: 700; font-size: 0.85rem;">New Assignment</span>
              <span style="font-size: 0.7rem; color: var(--text-muted);">10m ago</span>
            </div>
            <div style="font-size: 0.8rem; color: var(--text-secondary);">Week 3 Quiz is now available.</div>
            <div style="font-size: 0.7rem; color: var(--electric-violet); font-weight: 600; margin-top: 0.2rem;">Course Update</div>
          </div>
          <div style="padding: 1rem; border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 0.2rem; cursor: pointer; text-decoration: none; color: inherit;" onclick="window.location.href='/notifications'">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span style="font-weight: 700; font-size: 0.85rem;">Payment Received</span>
              <span style="font-size: 0.7rem; color: var(--text-muted);">2h ago</span>
            </div>
            <div style="font-size: 0.8rem; color: var(--text-secondary);">Course purchase successful.</div>
            <div style="font-size: 0.7rem; color: var(--neon-lime); font-weight: 600; margin-top: 0.2rem;">Payment</div>
          </div>
        </div>
        <div style="padding: 0.75rem; text-align: center; border-top: 1px solid var(--border-color);">
          <a th:href="@{/notifications}" style="font-size: 0.8rem; font-weight: 700; color: var(--text-primary);">View all notifications</a>
        </div>
      </div>
    </div>
    
    <!-- Profile Icon -->
    <div style="position: relative;" id="profile-dropdown-container">
      <div style="cursor: pointer; display: flex; align-items: center; gap: 0.5rem;">
        <div style="width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, var(--electric-violet), var(--midnight-plum)); display: flex; align-items: center; justify-content: center; font-weight: 800; color: #FFFFFF; border: 2px solid var(--border-color); box-shadow: var(--shadow-sm);" th:text="${user != null ? #strings.substring(user.fullName, 0, 1) : 'U'}">U</div>
      </div>
      
      <!-- Profile Dropdown Menu -->
      <div id="profile-menu" class="card" style="display: none; position: absolute; right: 0; top: 120%; width: 220px; z-index: 1000; padding: 0.5rem 0; box-shadow: var(--shadow-lg);">
        <div style="padding: 0.75rem 1rem; border-bottom: 1px solid var(--border-color);">
          <div style="font-weight: 700; color: var(--text-primary);" th:text="${user != null ? user.fullName : 'Guest User'}">User Name</div>
          <div style="font-size: 0.75rem; color: var(--text-muted);" th:text="${user != null ? user.email : 'guest@example.com'}">email</div>
        </div>
        <a th:href="@{/profile}" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; color: var(--text-primary); text-decoration: none; font-size: 0.85rem; transition: background 0.2s;" onmouseover="this.style.background='var(--bg-subtle)'" onmouseout="this.style.background='transparent'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          My Profile
        </a>
        <a th:href="@{/settings}" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; color: var(--text-primary); text-decoration: none; font-size: 0.85rem; transition: background 0.2s;" onmouseover="this.style.background='var(--bg-subtle)'" onmouseout="this.style.background='transparent'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          Account Settings
        </a>
        <div style="border-top: 1px solid var(--border-color); margin-top: 0.25rem; padding-top: 0.25rem;">
          <a th:href="@{/logout}" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; color: var(--danger, #ef4444); text-decoration: none; font-size: 0.85rem; font-weight: 700; transition: background 0.2s;" onmouseover="this.style.background='rgba(239, 68, 68, 0.1)'" onmouseout="this.style.background='transparent'">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
            Logout
          </a>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    // Handle dropdown toggle logic natively
    document.addEventListener('click', function(e) {
      const profileContainer = document.getElementById('profile-dropdown-container');
      const profileMenu = document.getElementById('profile-menu');
      if (profileContainer && !profileContainer.contains(e.target)) {
        if(profileMenu) profileMenu.style.display = 'none';
      }

      const notifContainer = document.getElementById('notification-dropdown-container');
      const notifMenu = document.getElementById('notification-menu');
      if (notifContainer && !notifContainer.contains(e.target)) {
        if(notifMenu) notifMenu.style.display = 'none';
      }
    });
    
    document.getElementById('profile-dropdown-container').addEventListener('click', function(e) {
       const menu = document.getElementById('profile-menu');
       if(menu) {
           if (menu.style.display === 'none' || menu.style.display === '') {
               menu.style.display = 'block';
           } else {
               menu.style.display = 'none';
           }
       }
    });

    document.getElementById('notification-toggle-btn').addEventListener('click', function(e) {
       const menu = document.getElementById('notification-menu');
       if(menu) {
           if (menu.style.display === 'none' || menu.style.display === '') {
               menu.style.display = 'block';
           } else {
               menu.style.display = 'none';
           }
       }
    });

    // Mobile-aware sidebar toggle
    function toggleSidebar() {
      var sidebar = document.querySelector('.sidebar');
      var isMobile = window.innerWidth <= 900;
      if (isMobile) {
        // On mobile, toggle slide-in overlay
        var backdrop = document.querySelector('.sidebar-backdrop');
        if (!backdrop) {
          backdrop = document.createElement('div');
          backdrop.className = 'sidebar-backdrop';
          document.body.appendChild(backdrop);
          backdrop.addEventListener('click', function() {
            sidebar.classList.remove('mobile-open');
            backdrop.classList.remove('active');
            document.body.style.overflow = '';
          });
        }
        var isOpen = sidebar.classList.contains('mobile-open');
        if (isOpen) {
          sidebar.classList.remove('mobile-open');
          backdrop.classList.remove('active');
          document.body.style.overflow = '';
        } else {
          sidebar.classList.add('mobile-open');
          backdrop.classList.add('active');
          document.body.style.overflow = 'hidden';
        }
      } else {
        // On desktop, toggle collapsed state
        sidebar.classList.toggle('collapsed');
      }
    }
  </script>
</header>
</body>
</html>
