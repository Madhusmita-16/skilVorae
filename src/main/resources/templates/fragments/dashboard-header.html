<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header class="dashboard-header" th:fragment="header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-color);">
  <button id="sidebar-toggle-btn" class="btn btn-outline btn-sm" style="padding: 0.4rem 0.6rem; display: flex; align-items: center; gap: 0.5rem;" onclick="document.querySelector('.sidebar').classList.toggle('collapsed')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
  </button>

  <div style="display: flex; align-items: center; gap: 1rem; position: relative;">
    <!-- Notification Icon -->
    <button class="btn btn-outline btn-sm" style="padding: 0.4rem; position: relative; display: flex; align-items: center; justify-content: center; border-radius: 50%;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      <span class="badge badge-advanced" style="position: absolute; top: -5px; right: -5px; font-size: 0.6rem; padding: 0.15rem 0.3rem;">3</span>
    </button>
    
    <!-- Profile Icon -->
    <div style="position: relative;" id="profile-dropdown-container">
      <div style="cursor: pointer; display: flex; align-items: center; gap: 0.5rem;" onclick="document.getElementById('profile-menu').classList.toggle('show')">
        <div style="width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--electric-violet), var(--midnight-plum)); display: flex; align-items: center; justify-content: center; font-weight: 800; color: #FFFFFF; border: 2px solid var(--border-color);" th:text="${user != null ? #strings.substring(user.fullName, 0, 1) : 'U'}">U</div>
      </div>
      
      <!-- Profile Dropdown Menu -->
      <div id="profile-menu" class="card" style="display: none; position: absolute; right: 0; top: 120%; width: 200px; z-index: 1000; padding: 0.5rem; box-shadow: var(--shadow-lg);">
        <a th:href="@{/profile}" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem; color: var(--off-white); text-decoration: none; border-radius: 4px; transition: background 0.2s;" onmouseover="this.style.background='var(--bg-subtle)'" onmouseout="this.style.background='transparent'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          Profile
        </a>
        <a th:href="@{/logout}" style="display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem; color: var(--danger, #ef4444); text-decoration: none; border-radius: 4px; transition: background 0.2s;" onmouseover="this.style.background='var(--bg-subtle)'" onmouseout="this.style.background='transparent'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          Logout
        </a>
      </div>
    </div>
  </div>
  
  <script>
    // Handle dropdown toggle logic natively
    document.addEventListener('click', function(e) {
      const container = document.getElementById('profile-dropdown-container');
      const menu = document.getElementById('profile-menu');
      if (container && !container.contains(e.target)) {
        if(menu) menu.style.display = 'none';
      }
    });
    
    document.getElementById('profile-dropdown-container').addEventListener('click', function(e) {
       const menu = document.getElementById('profile-menu');
       if(menu) {
           if (menu.style.display === 'none' || menu.style.display === '') {
               menu.style.display = 'block';
           } else {
               menu.style.display = 'none';
           }
       }
    });
  </script>
</header>
</body>
</html>
