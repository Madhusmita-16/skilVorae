<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <nav class="navbar" th:fragment="navbar">
    <div class="container">
      <a th:href="@{/}" class="brand-logo">
        <div class="brand-icon">S</div>
        <span>SkilVorae</span>
      </a>

      <ul class="nav-links">
        <li><a th:href="@{/courses}" class="nav-link">Catalog</a></li>
        <li><a th:href="@{/courses(difficulty='BEGINNER')}" class="nav-link">Beginner</a></li>
        <li><a th:href="@{/courses(difficulty='ADVANCED')}" class="nav-link">Advanced Full Stack</a></li>
        <li th:if="${user != null}"><a th:href="@{/dashboard}" class="nav-link">Dashboard</a></li>
        <li th:if="${user != null and user.role.name() == 'ADMIN'}"><a th:href="@{/admin/dashboard}" class="nav-link" style="color: var(--accent); font-weight: 700;">Admin</a></li>
        <li th:if="${user != null and (user.role.name() == 'INSTRUCTOR' or user.role.name() == 'ADMIN')}"><a th:href="@{/instructor/dashboard}" class="nav-link" style="color: var(--success); font-weight: 700;">Instructor</a></li>
      </ul>

      <div class="nav-auth" style="position: relative;">
        <!-- Theme Toggle -->
        <button id="theme-toggle-btn" class="btn btn-outline btn-sm" title="Toggle Light/Dark Theme" style="padding: 0.4rem 0.65rem; font-weight: 600;">Theme</button>

        <th:block th:if="${user == null}">
          <a th:href="@{/login}" class="btn btn-outline btn-sm">Login</a>
          <a th:href="@{/register}" class="btn btn-primary btn-sm">Get Started</a>
        </th:block>

        <th:block th:if="${user != null}">
          <!-- Notifications Bell -->
          <div style="position: relative;">
            <button id="notif-bell-btn" onclick="toggleNotifDropdown()" class="btn btn-outline btn-sm" style="padding: 0.4rem 0.65rem; position: relative; font-weight: 600;">
              Notifications <span id="notif-badge" class="badge badge-advanced" style="position: absolute; top: -6px; right: -6px; font-size: 0.65rem; padding: 0.15rem 0.35rem; display: none;">0</span>
            </button>
            
            <div id="notif-dropdown" class="card" style="display: none; position: absolute; right: 0; top: 120%; width: 320px; z-index: 1000; padding: 1rem; box-shadow: var(--shadow-lg);">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">
                <span style="font-weight: 700; font-size: 0.9rem;">Notifications</span>
                <button onclick="markAllNotificationsRead()" style="background: none; border: none; font-size: 0.75rem; color: var(--primary); cursor: pointer; font-weight: 600;">Mark all read</button>
              </div>
              <div id="notif-list" style="display: flex; flex-direction: column; gap: 0.6rem; max-height: 250px; overflow-y: auto; font-size: 0.825rem;">
                <div style="text-align: center; color: var(--text-muted); padding: 1rem;">Loading notifications...</div>
              </div>
            </div>
          </div>

          <a th:href="@{/dashboard}" class="btn btn-outline btn-sm" th:text="${user.fullName}">My Account</a>
          <a th:href="@{/logout}" class="btn btn-primary btn-sm">Logout</a>
        </th:block>
      </div>
    </div>
  </nav>
</body>
</html>
