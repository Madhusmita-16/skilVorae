<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — SkilVorae</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card-login auth-fade-in">
      
      <div style="text-align: center; margin-bottom: 2rem;">
        <a href="/" class="brand-logo" style="justify-content: center; margin-bottom: 1.25rem;">
          <div class="brand-icon">S</div>
          <span>SkilVorae</span>
        </a>
        <h1 style="font-size: 1.85rem; margin-bottom: 0.35rem;">Welcome back to Skilvorae</h1>
        <p style="font-size: 0.925rem; color: var(--text-muted);">Sign in to continue your learning and professional journey.</p>
      </div>

      <!-- ALERTS & NOTIFICATIONS -->
      
      
      

      <!-- COMPACT ROLE SELECTOR TABS -->
      <div class="compact-role-tabs">
        <button type="button" class="compact-role-tab active" id="role-tab-STUDENT" onclick="selectLoginRole('STUDENT')">Student</button>
        <button type="button" class="compact-role-tab" id="role-tab-INSTRUCTOR" onclick="selectLoginRole('INSTRUCTOR')">Instructor</button>
        <button type="button" class="compact-role-tab" id="role-tab-ADMIN" onclick="selectLoginRole('ADMIN')">Admin</button>
      </div>

      <form action="/login-process" method="post" id="login-form">
        <input type="hidden" id="loginRole" name="role" value="STUDENT">

        <div class="form-group">
          <label class="form-label" for="username">Email Address</label>
          <input type="email" id="username" name="username" class="form-control" placeholder="e.g. student@skilvorae.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
            <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
            <a href="/forgot-password" style="font-size: 0.825rem; font-weight: 600; color: var(--primary);">Forgot Password?</a>
          </div>
          <div style="position: relative;">
            <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" onclick="toggleLoginPassword(this)" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 0.8rem; font-weight: 600;">Show</button>
          </div>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--text-secondary); cursor: pointer;">
            <input type="checkbox" name="remember-me" checked style="accent-color: var(--primary);"> Remember me
          </label>
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block" style="padding: 0.85rem;">Sign In</button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: var(--text-muted);">
        Don’t have an account? <a href="/register" style="font-weight: 700; color: var(--primary);">Create Account</a>
      </div>

    </div>
  </div>

  <script src="/js/main.js"></script>
  <script>
    function selectLoginRole(role) {
      document.querySelectorAll('.compact-role-tab').forEach(tab => tab.classList.remove('active'));
      const activeTab = document.getElementById('role-tab-' + role);
      if (activeTab) activeTab.classList.add('active');

      document.getElementById('loginRole').value = role;
      const emailInput = document.getElementById('username');

      if (role === 'STUDENT') {
        emailInput.placeholder = 'e.g. student@skilvorae.com';
      } else if (role === 'INSTRUCTOR') {
        emailInput.placeholder = 'e.g. instructor@skilvorae.com';
      } else if (role === 'ADMIN') {
        emailInput.placeholder = 'e.g. admin@skilvorae.com';
      }
    }

    function toggleLoginPassword(btn) {
      const input = document.getElementById('password');
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = 'Hide';
      } else {
        input.type = 'password';
        btn.textContent = 'Show';
      }
    }
  </script>
</body>
</html>
